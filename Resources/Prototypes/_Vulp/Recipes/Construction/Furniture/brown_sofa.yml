#Brown Sofa

 #Middle
 - type: construction
   name: "Comfy Sofa Brown"
   id: ChairSofaBenchBrown
   graph: ChairSofaBenchBrown
   startNode: start
   targetNode: chairsofabenchbrown
   category: construction-category-furniture
   description: A comfy sofa of standard design.
   icon: { sprite: SimpleStation14/Structures/Furniture/Benches/sofa.rsi, state: middle }
   objectType: Structure
   placementMode: SnapgridCenter
   canRotate: true
   canBuildInImpassable: false
   conditions:
   - !type:TileNotBlocked

 - type: constructionGraph
   id: ChairSofaBenchBrown
   start: start
   graph:
   - node: start
     actions:
     - !type:DestroyEntity { }
     edges:
     - to: chairsofabenchbrown
       completed:
       - !type:SnapToGrid { }
       steps:
       - material: Steel
         amount: 4
         doAfter: 1
       - material: Cloth
         amount: 2

   - node: chairsofabenchbrown
     entity: BenchSofaMiddle
     edges:
     - to: start
       completed:
       - !type:SpawnPrototype
         prototype: SheetSteel1
         amount: 2
       steps:
       - tool: Prying
         doAfter: 3
       - tool: Screwing
         doAfter: 2

