- type: biomeMarkerLayer
  id: CritterSpawnLocations
  prototype: VentEventSpawnerWeight5
  radius: 16
  minGroupSize: 1
  maxGroupSize: 5

- type: biomeMarkerLayer
  id: MiscAnimals
  prototype: PlanetAnimalSpawner
  radius: 20
  minGroupSize: 1
  maxGroupSize: 1

# DeepCaves
- type: biomeTemplate
  id: DeepCaves
  layers:
    - !type:BiomeEntityLayer
      threshold: 0.75
      noise:
        seed: 2
        noiseType: OpenSimplex2
        fractalType: PingPong
      allowedTiles:
        - FloorPlanetCave # Vulp
      entities:
        - CrystalGreen
        - CrystalPink
        - CrystalOrange
        - CrystalBlue
        - CrystalCyan
        - WallRock
    - !type:BiomeEntityLayer
      threshold: 0.1
      noise:
        seed: 1
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
      - FloorPlanetCave # Vulp
      entities:
      - WallRock
    - !type:BiomeEntityLayer
      threshold: 0.85
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
      allowedTiles:
        - FloorSand # Vulp
      entities:
        - WallRock
    - !type:BiomeDummyLayer
      id: Loot
    - !type:BiomeTileLayer
      threshold: -1.0
      tile: FloorPlanetCave # Vulp 

- type: biomeTemplate
  id: DeepCaveCrags
  layers:
    - !type:BiomeMetaLayer
      template: Lava
    - !type:BiomeMetaLayer
      template: DeepCaves
      threshold: -0.5
      noise:
        seed: 0
        frequency: 0.001
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:BiomeMetaLayer
      template: Caves
      threshold: .73
      noise:
        seed: 1
        frequency: 0.003
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
    - !type:BiomeMetaLayer
      template: Grasslands
      threshold: .75
      noise:
        seed: 2
        frequency: 0.003
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 2
        lacunarity: 2
