#bar sign
- type: construction
  name: "Bar Sign"
  id: BarSign
  graph: BarSign
  startNode: start
  targetNode: barsign
  category: construction-category-furniture
  description: Bar! Get drunk here.
  icon: { sprite: _Nuclear14/Structures/Wallmounts/signs_32x32.rsi, state: bar }
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: true

- type: constructionGraph
  id: BarSign
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity { }
    edges:
    - to: barsign
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: Steel
        amount: 5
        doAfter: 1
      - material: Cable
        amount: 2
        doAfter: 1
      - material: Glass
        amount: 2
        doAfter: 5

  - node: barsign
    entity: SignBar2
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetGlass1
        amount: 2
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 5
      - !type:SpawnPrototype
        prototype: CableApcStack1
        amount: 2
      steps:
      - tool: Prying
        doAfter: 3
      - tool: Screwing
        doAfter: 2
      - tool: Cutting
        doAfter: 1

