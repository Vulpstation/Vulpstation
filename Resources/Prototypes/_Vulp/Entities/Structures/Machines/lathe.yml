# Vulp - this is already upstream in EE (f53d2f9) but not Floof.
- type: entity
  id: Biogenerator
  parent: BaseLathe
  name: biogenerator
  description: Converts plants into biomass, which can be used to construct useful items.
  components:
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: BiogeneratorMachineCircuitboard
  - type: MaterialStorage
    insertOnInteract: false
    canEjectStoredMaterials: false
  - type: ProduceMaterialExtractor
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    reagentOutputSlotId: beaker_slot
    idleState: icon
    runningState: building
    staticRecipes:
    - BioGenMilk
    - BioGenMilkSoy
    - BioGenEthanol
    - BioGenCream
    - BioGenBlackpepper
    - BioGenEnzyme
    - BioGenFlour
    - BioGenSugar
    - BioGenMonkeyCube
    - BioGenKoboldCube
    - BioGenMaterialCloth1
    - BioGenMaterialCardboard1
    - BioGenPaper
    - BioGenPaperRolling1
    - BioGenCandle
    - BioGenPlantBGone
    - BioGenWeedKiller
    - BioGenPestKiller
    - BioGenLeft4Zed
    - BioGenEZNutrient
    - BioGenRobustHarvest
