# Tables
- type: construction
  name: "Wood Table Square"
  id: WoodTableSquare
  graph: WoodTableSquare
  startNode: start
  targetNode: woodtablesquare
  category: construction-category-furniture
  description: A somewhat fancier square wooden table.
  icon: { sprite: _Nuclear14/Structures/Furniture/Tables/tables.rsi, state: table_wood_square }
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: true
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: WoodTableSquare
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity { }
    edges:
    - to: woodtablesquare
      completed:
      - !type:SnapToGrid { }
      steps:
      - material: WoodPlank
        amount: 4
        doAfter: 3

  - node: woodtablesquare
    entity: N14TableWoodSquare
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 4
      steps:
      - tool: Prying
        doAfter: 3
      - tool: Screwing
        doAfter: 2

